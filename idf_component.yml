version: "0.7.0-dev"
description: "Sandbox with hardware IO and hot reload for ESP32 devices"
url: "https://github.com/inanimate-tech/resident"

dependencies:
  idf:
    version: ">=5.0.0"
  espressif/arduino-esp32:
    version: "^3.0.0"
  # Courier: the surface Resident relies on landed in 0.5.0 — NTP-first time
  # sync (robust HTTPS-Date fallback), larger receivable payloads on no-PSRAM
  # boards, and per-transport endpoint state (Resident sets the WS endpoint via
  # _ws.setEndpoint() inside onTransportsWillConnect(), which requires that
  # surface). Pinned to ^0.6.0, which makes Client::onMessage deliver the
  # default transport only (receive parallels send) — required so channel
  # routing (Resident's `channel` envelope field) sees one coherent message
  # stream per transport instead of everything funnelled through onMessage.
  inanimate/courier:
    version: "^0.6.0"
  bblanchon/arduinojson:
    version: "^7.0.0"
  # Esp32Lua is not on the ESP component registry. Consumers must provide it
  # as a local component named `Esp32Lua` (e.g. via a fetch script that clones
  # https://github.com/Fischer-Simon/Esp32Lua and writes a CMakeLists.txt).
  # See examples/espidf-basic/tools/fetch-deps.sh for the canonical pattern.
files:
  # compote does not read .gitignore — we must explicitly exclude build
  # artifacts and dev-only files, or they end up in the published tarball.
  exclude:
    - "**/.pio/**/*"
    - "**/node_modules/**/*"
    - "**/managed_components/**/*"
    - "**/build/**/*"
    - "dist/**/*"
    - "examples/**/*"
    - "device-apps/**/*"
    - ".claude/**/*"
    - ".github/**/*"
    - ".vscode/**/*"
    - "docs/superpowers/**/*"
    - "tools/**/*"
    - "test/**/*"
    - "**/.DS_Store"
    - "**/package-lock.json"
    - "**/sdkconfig"
    - "**/sdkconfig.*"
    - "**/dependencies.lock"
    - "CLAUDE.md"
    - "docs/publishing.md"
    - "docs/changelog.md"
    - "docs/start-building.md"
    - ".gitignore"
