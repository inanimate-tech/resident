[env:native]
platform = native
test_framework = unity
# The LVGL suites need LVGL and luavgl; they run in env:native-lvgl below.
test_ignore = test_lvgl_*
# lib_compat_mode + -Iinclude: Esp32Lua declares "platforms": "espressif32"
# but contains plain Lua 5.4 C sources; Arduino.h/Print.h stubs in include/
# satisfy its C++ wrapper's unconditional Arduino includes.
lib_compat_mode = off
build_flags =
    -std=gnu++17
    -Wall
    -Iinclude
    # -I../../src: expose Resident src/ headers to native test builds
    -I../../src
    # The execution deadline's host one-shot is a std::thread; GNU libstdc++
    # needs -pthread. SCons routes it to both CCFLAGS and LINKFLAGS.
    -pthread
lib_deps =
    fischer-simon/Esp32Lua@^5.4.7
    # ArduinoJson is header-only and platform-independent; the real library
    # satisfies ResidentSandbox.h's <ArduinoJson.h> include natively, so it
    # isn't stubbed like Arduino/Courier/ezTime.
    bblanchon/ArduinoJson@^7

# The suites that run ResidentLvglModule against real LVGL and luavgl, on the
# host, with a fake panel (test_lvgl_*). LVGL is the commit the luavgl fork's
# deps/lvgl submodule tracks, as in the m5stick-lvgl example; luavgl is
# pinned to a commit so the suite does not move under a fork change.
[env:native-lvgl]
extends = env:native
test_ignore =
test_filter = test_lvgl_*
build_flags =
    ${env:native.build_flags}
    # lv_conf_internal.h stringifies LV_CONF_PATH itself: no quotes here.
    -DLV_CONF_PATH=${PROJECT_DIR}/lvgl/lv_conf.h
    # luavgl includes bare <lua.h>; Esp32Lua ships its headers at src/lua/
    -I${PROJECT_LIBDEPS_DIR}/${PIOENV}/Esp32Lua/src/lua
    # luavgl's font.c and style.c call malloc/free without <stdlib.h>, which
    # the ESP32 toolchain's headers pull in for them and the host's do not.
    -include stdlib.h
lib_deps =
    ${env:native.lib_deps}
    lvgl=https://github.com/XuNeo/lvgl/archive/d18e58d2f2dff763efadef5594ffb2b29d9102b6.tar.gz
    luavgl=https://github.com/inanimate-tech/luavgl/archive/b9824223ddbeee314d580775244d66e7bb1c8c37.tar.gz
